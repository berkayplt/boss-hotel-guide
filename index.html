<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Istanbul Guide | Boss Hotel Sultanahmet</title>
  <meta name="description" content="Your Istanbul guide from Boss Hotel Sultanahmet: discover nearby sights, local stories and directions from our hotel.">
  <meta name="theme-color" content="#F7F7F4">
  <link rel="icon" href="assets/logo-mark.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Kiril ve Arap harfli fontlar yalnızca o dil seçildiğinde indirilir -->
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Marcellus&family=Forum&family=Golos+Text:wght@400;500;600&family=Amiri&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261116-rank">
</head>
<body class="pending">
  <div class="app" id="app">
    <!-- Dil seçici her sekmede sağ üstte -->
    <div class="top">
      <label class="lang" for="lang-select">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.4 5.2 3.4 8.5s-1.1 6.1-3.4 8.5c-2.3-2.4-3.4-5.2-3.4-8.5s1.1-6.1 3.4-8.5z"/></svg>
        <span class="lang-copy" aria-hidden="true">
          <span class="lang-label" data-i18n="langLabel">Language</span>
          <span class="lang-name" id="lang-name" dir="auto">English</span>
        </span>
        <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        <select id="lang-select"></select>
      </label>
    </div>

    <!-- ========== Otel: karşılama ekranı ========== -->
    <section class="view" data-view="hotel">
      <header class="hero">
        <img class="hero-logo" src="assets/logo-full.png" alt="Boss Hotel Sultanahmet" width="640" height="442">
        <h1 class="hero-title greet" id="greet"></h1>
        <!-- Yerel saat ve hava durumu; hava durumu alınamazsa sadece saat görünür -->
        <div class="now-line">
          <span class="now-weather" id="weather" hidden></span>
          <span class="now-clock">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
            <span class="sr" data-i18n="localTime"></span> <time id="clock" dir="ltr"></time>
          </span>
        </div>
      </header>

      <!-- Ana ekrandan iki ana bölüme hızlı geçiş -->
      <nav class="quick" aria-label="">
        <a class="quick-btn" href="#guide">
          <span class="quick-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/></svg></span>
          <span class="quick-title" data-i18n="navGuide"></span>
          <span class="quick-hint" data-i18n="guideHint"></span>
        </a>
        <a class="quick-btn" href="#transport">
          <span class="quick-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="12" rx="3"/><path d="M6 11h12M9.5 14h.01M14.5 14h.01M9 2.5h6M12 2.5V5M8.5 17l-2 4M15.5 17l2 4"/></svg></span>
          <span class="quick-title" data-i18n="navTransport"></span>
          <span class="quick-hint" data-i18n="transportHint"></span>
        </a>
      </nav>

      <!-- Yalnızca kahvaltı saatinde görünür -->
      <div class="live" id="live-breakfast" role="status" hidden>
        <span class="live-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 9h11v4.5a5.5 5.5 0 0 1-11 0z"/><path d="M16 10.5h1.3a2.5 2.5 0 0 1 0 5H15.5"/><path d="M8 3.5c-.6.9-.6 1.6 0 2.5M11.5 3.5c-.6.9-.6 1.6 0 2.5"/><path d="M4 21h13"/></svg></span>
        <span class="live-text">
          <span class="live-title" data-i18n="breakfastNow"></span>
          <span class="live-sub" id="live-breakfast-sub"></span>
        </span>
        <span class="live-dot" aria-hidden="true"></span>
        <span class="live-bar" aria-hidden="true"><span id="live-breakfast-bar"></span></span>
      </div>

      <!-- Gezi Rehberi kartı: öne çıkan mekânların fotoğrafları sırayla döner -->
      <a class="guide-card" href="#guide" id="guide-card">
        <span class="guide-slides" id="guide-slides"></span>
        <span class="guide-dots" id="guide-dots" aria-hidden="true"></span>
        <span class="guide-copy">
          <span class="guide-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/></svg></span>
          <span class="guide-text">
            <span class="guide-title" data-i18n="navGuide"></span>
            <span class="guide-hint" data-i18n="guideHint"></span>
          </span>
          <svg class="fwd" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </span>
      </a>

      <section class="block" aria-labelledby="info-title">
        <h2 class="block-title" id="info-title" data-i18n="infoTitle"></h2>
        <ul class="tiles" id="tiles"></ul>

        <div class="card addr">
          <span class="info-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.3"/></svg></span>
          <div class="addr-text">
            <p class="info-label" data-i18n="address"></p>
            <p class="addr-line" id="hotel-addr"></p>
            <button type="button" class="btn btn-quiet btn-small" data-action="home">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
              <span data-i18n="homeBtn"></span>
            </button>
          </div>
        </div>

        <section class="card rules" id="rules" aria-labelledby="rules-title">
          <h3 class="rules-head"><span id="rules-title" data-i18n="rules"></span><span class="rules-count" id="rules-count"></span></h3>
          <ul id="rules-list"></ul>
        </section>
      </section>

      <section class="review" id="review" hidden>
        <span class="stars" aria-hidden="true"></span>
        <h2 class="review-title" data-i18n="reviewTitle"></h2>
        <p class="review-body" data-i18n="reviewBody"></p>
        <a class="review-btn" id="review-link" target="_blank" rel="noopener">
          <span data-i18n="reviewAction"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
      </section>
    </section>

    <!-- ========== Gezi Rehberi ========== -->
    <section class="view" data-view="guide" hidden>
      <header class="hero page-head">
        <h1 class="hero-title" data-i18n="title"></h1>
        <p class="hero-text" data-i18n="intro"></p>
      </header>
      <ol class="route" id="route" aria-label=""></ol>
      <div class="foot-home">
        <p class="foot-title" data-i18n="homeTitle"></p>
        <button type="button" class="btn btn-quiet" data-action="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
          <span data-i18n="homeBtn"></span>
        </button>
        <p class="foot-note" data-i18n="note"></p>
      </div>
    </section>

    <!-- ========== Ulaşım ========== -->
    <section class="view" data-view="transport" hidden>
      <header class="hero page-head">
        <h1 class="hero-title" data-i18n="navTransport"></h1>
      </header>
      <div id="transport-list"></div>
    </section>

    <footer class="foot">
      <img class="foot-mark" src="assets/logo-mark.png" alt="" width="48" height="48">
      <p class="foot-bye" data-i18n="farewell"></p>
      <details class="credits">
        <summary data-i18n="credits"></summary>
        <ul id="credit-list"></ul>
        <p class="foot-data">
          <a href="https://open-meteo.com/" target="_blank" rel="noopener" data-i18n="weatherCredit"></a><br>
          <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" data-i18n="stopsCredit"></a>
        </p>
      </details>
    </footer>
  </div>

  <!-- Alt menü: Otel, Gezi Rehberi, Ulaşım -->
  <nav class="tabs" id="tabs" aria-label="">
    <a href="#hotel" data-tab="hotel">
      <span class="tab-pill"><span class="tab-mark"><img src="assets/logo-mark.png" alt=""></span></span>
      <span class="tab-label" data-i18n="navHotel"></span>
    </a>
    <a href="#guide" data-tab="guide">
      <span class="tab-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/></svg></span>
      <span class="tab-label" data-i18n="navGuide"></span>
    </a>
    <a href="#transport" data-tab="transport">
      <span class="tab-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="12" height="12" rx="3"/><path d="M6 11h12M9.5 14h.01M14.5 14h.01M9 2.5h6M12 2.5V5M8.5 17l-2 4M15.5 17l2 4"/></svg></span>
      <span class="tab-label" data-i18n="navTransport"></span>
    </a>
  </nav>

  <!-- Saat kutusu ayrıntısı (kahvaltı, resepsiyon) -->
  <div class="picker" id="sheet" hidden>
    <div class="picker-shade" data-close-sheet></div>
    <div class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <span class="grip" aria-hidden="true"></span>
      <h2 id="sheet-title"></h2>
      <div id="sheet-body"></div>
      <button type="button" class="picker-cancel" data-close-sheet data-i18n="close"></button>
    </div>
  </div>

  <!-- Mekân detayı -->
  <section class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="d-name" hidden>
    <div class="detail-scroll" id="detail-scroll">
      <figure class="d-photo">
        <img id="d-img" alt="">
        <figcaption id="d-credit"></figcaption>
      </figure>
      <button type="button" class="back" id="back-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span class="sr" data-i18n="back"></span>
      </button>
      <article class="d-body">
        <h2 class="d-name" id="d-name"></h2>
        <p class="d-tag" id="d-tag"></p>
        <dl class="facts" id="d-facts"></dl>
        <p class="travel-time-note d-travel-note" id="d-travel-note" data-i18n="travelTimeNote" hidden></p>
        <p class="d-lead" id="d-lead"></p>
        <div class="d-text" id="d-text"></div>
        <section class="tips">
          <h3 data-i18n="tips"></h3>
          <ul id="d-tips"></ul>
        </section>
      </article>
    </div>
    <div class="d-action">
      <button type="button" class="btn btn-go" id="go-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.3"/></svg>
        <span data-i18n="go"></span>
      </button>
      <p class="d-app" id="d-app" hidden></p>
    </div>
  </section>

  <!-- Harita uygulaması seçimi -->
  <div class="picker" id="picker" hidden>
    <div class="picker-shade" data-close></div>
    <div class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <span class="grip" aria-hidden="true"></span>
      <h2 id="picker-title" data-i18n="pickTitle"></h2>
      <p class="picker-dest" id="picker-dest"></p>
      <div class="picker-opts" id="picker-opts"></div>
      <label class="remember">
        <input type="checkbox" id="remember">
        <span data-i18n="remember"></span>
      </label>
      <button type="button" class="picker-cancel" data-close data-i18n="cancel"></button>
    </div>
  </div>

  <script src="data.js?v=20261116-rank"></script>
  <script src="app.js?v=20261116-rank"></script>
</body>
</html>
